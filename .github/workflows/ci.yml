name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Ref-based group: a new push to a PR branch cancels its superseded run.
# Master pushes are never cancelled (each one must complete), so they get a
# unique group per commit.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run check:basalt
      - run: bun run test:unit

  go-checks:
    name: Go Build, Test & OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Advisory until github.com/docker/docker moves to moby/moby: GO-2026-4887 and
      # GO-2026-4883 have no fixed release there (Fixed in: N/A), so a blocking
      # step would fail every run. Drop continue-on-error after the migration.
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
      - name: Check OpenAPI spec is up to date
        run: |
          go run ./cmd/gendocs 2>/dev/null > /tmp/fresh_openapi.json
          if ! diff -u apps/dashboard/openapi.json /tmp/fresh_openapi.json; then
            echo ""
            echo "openapi.json is out of date. Regenerate:"
            echo "  docker run --rm -v \$(pwd):/workspace -w /workspace golang:1.27.3-alpine go run ./cmd/gendocs 2>/dev/null > apps/dashboard/openapi.json"
            exit 1
          fi

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, go-checks]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      # Build the server image once here; e2e/setup/global.ts skips its own
      # build when rollhook-e2e-server:latest already exists. Shares the gha
      # cache scope with release.yml.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: rollhook-e2e-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Pre-pull Docker images (with retry)
        run: |
          pulled=0
          for i in 1 2 3; do
            if docker pull oven/bun:1.3.10-slim; then
              pulled=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Pull attempt $i failed, retrying in 30s..."
              sleep 30
            fi
          done
          if [ "$pulled" -ne 1 ]; then
            echo "Failed to pull oven/bun:1.3.10-slim after 3 attempts"
            exit 1
          fi
      - name: Run E2E tests
        run: bun run test:e2e
        timeout-minutes: 12
      - name: Upload E2E job logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-job-logs
          path: data/logs/
          if-no-files-found: ignore
