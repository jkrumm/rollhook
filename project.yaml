# How the factory ships this project (software-factory docs/project.md).
apiVersion: factory/v2
name: rollhook
deploy:
  # A merge to master deploys nothing the factory can verify: the server image ships through the manual
  # `Make Release` workflow (the VPS then pulls :latest) and the marketing site deploys from its own workflow.
  # `make verify` stays a standalone production readiness probe.
  mode: none
ship:
  - { via: pr } # rollhook is PR-required (dotfiles config/pr-required-repos.json)
# One lead at a time: e2e/compose.e2e.yml fixes the compose project name, the network, host port 18080 and the
# rollhook-e2e-* image tags, so two E2E runs on the one Docker host collide.
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
