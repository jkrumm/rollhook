# Included by every location: add_header in a location replaces (does not
# extend) the server-level set, so these are repeated via include. `always`
# keeps them on 404/5xx responses too.
#
# CSP matches what Astro emits: one inline <style> and inline style attributes
# (style-src 'unsafe-inline'), a non-executing JSON-LD block (not governed by
# script-src), self-hosted fonts and images.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
