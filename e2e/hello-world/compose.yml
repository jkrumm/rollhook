services:
  hello-world:
    # IMAGE_TAG is the full image URI — written by RollHook before each deploy
    image: ${IMAGE_TAG:-localhost:7700/rollhook-e2e-hello:v1}
    environment:
      PORT: '3000'
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      # Compose must define a healthcheck (RollHook's validate step requires one), and it
      # overrides the image's HEALTHCHECK. Keep these timings equal to Dockerfile.unhealthy's
      # (2s interval, 3 retries) so the unhealthy variant is flagged after ~start_period + 6s.
      # start_interval probes every 1s during start_period so a healthy container is ready fast.
      interval: 2s
      timeout: 2s
      start_period: 5s
      start_interval: 1s
      retries: 3
    labels:
      - rollhook.allowed_repos=rollhook-e2e/hello
      - traefik.enable=true
      - traefik.http.routers.hello.rule=PathPrefix(`/`)
      - traefik.http.routers.hello.entrypoints=web
      - traefik.http.services.hello.loadbalancer.server.port=3000
      - traefik.http.services.hello.loadbalancer.healthcheck.path=/health
      - traefik.http.services.hello.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.hello.loadbalancer.healthcheck.timeout=1s
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: e2e_traefik
